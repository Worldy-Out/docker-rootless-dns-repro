name: Synthetic systemd 259 manager socket
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-broker-user-bus
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Verify source and offline failure contracts
        run: |
          sha256sum --check BROKER_MANAGER_SHA256SUMS
          python3 -I -B test_broker_manager_repro.py
      - name: Exercise only the native user-bus scenario
        run: |
          sudo env GITHUB_ACTIONS=true CI=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUN_BROKER_MANAGER_REPRO=yes python3 -I -B broker_manager_repro.py --output broker-manager-259-results
      - name: Print bounded synthetic evidence
        if: always()
        run: |
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          p=Path('broker-manager-259-results/result.json')
          if p.exists():
              raw=p.read_bytes()
              assert len(raw)<100000
              print('BEGIN_SYNTHETIC_BROKER_MANAGER_EVIDENCE')
              print(json.dumps({'sha256':hashlib.sha256(raw).hexdigest(),'value':json.loads(raw)},sort_keys=True))
              print('END_SYNTHETIC_BROKER_MANAGER_EVIDENCE')
          PYCODE
